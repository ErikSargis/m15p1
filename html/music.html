<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La meva música | Diari 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/grid.css">
</head>
<body>
    <header class="page-header">
        <h1>La meva música</h1>
    </header>

    <main class="content music-content">
        <nav class="site-nav" aria-label="Navegació principal">
            <a href="index.html">Torna a l'inici</a>
        </nav>

        <section aria-labelledby="playlist-heading">
            <h2 id="playlist-heading">>Les meves cançons</h2>
            <div class="song-grid">
                <article class="song-card">
                    <iframe
                        class="song-embed song-embed--video"
                        src="https://www.youtube-nocookie.com/embed/PDYg5BGlrtI"
                        title="Reproductor de YouTube, cançó 1"
                        loading="lazy"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen>
                    </iframe>
                </article>
                <article class="song-card">
                    <iframe
                        class="song-embed song-embed--video"
                        src="https://www.youtube-nocookie.com/embed/Zs_dIIXuNio"
                        title="Reproductor de YouTube, cançó 2"
                        loading="lazy"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen>
                    </iframe>
                </article>
            </div>
        </section>
